<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>CMT Inventory — Sign In</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="login-screen">
    <main class="login-card">
      <h1 class="login-title">CMT Spare Parts</h1>
      <p class="login-sub">Enter your 4-digit PIN to continue</p>

      <div id="pin-dots" class="pin-dots" aria-label="PIN entry">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>

      <div id="pin-pad" class="pin-pad">
        <button type="button" class="pin-key" data-key="1">1</button>
        <button type="button" class="pin-key" data-key="2">2</button>
        <button type="button" class="pin-key" data-key="3">3</button>
        <button type="button" class="pin-key" data-key="4">4</button>
        <button type="button" class="pin-key" data-key="5">5</button>
        <button type="button" class="pin-key" data-key="6">6</button>
        <button type="button" class="pin-key" data-key="7">7</button>
        <button type="button" class="pin-key" data-key="8">8</button>
        <button type="button" class="pin-key" data-key="9">9</button>
        <button type="button" class="pin-key action" data-key="clear">Clear</button>
        <button type="button" class="pin-key" data-key="0">0</button>
        <button type="button" class="pin-key action" data-key="back">⌫</button>
      </div>
    </main>

    <!--
      Login screen is intentionally self-contained:
        * The PIN-pad UI runs as plain (non-module) inline JS so buttons
          respond instantly, regardless of bundler / network / cache.
        * Supabase is loaded as an ES module from a CDN (esm.sh) — that
          URL needs no bundler, no relative path, and no .env. It works
          under `npm run dev`, `npm run preview`, or even file://.
      Once signed in, the worker / dashboard pages still use the bundled
      npm version of @supabase/supabase-js as before.
    -->
    <script>
      // The Supabase project URL + anon key. They are inlined here on
      // purpose: the anon key is meant to be exposed on the public web,
      // it's the same key that's already in import.meta.env for the rest
      // of the app. Row Level Security in Supabase is what actually
      // protects the data.
      window.__CMT_SUPABASE_URL = 'https://kmxyzefizirgjbcznvei.supabase.co';
      window.__CMT_SUPABASE_ANON_KEY =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtteHl6ZWZpemlyZ2piY3pudmVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMjMwOTMsImV4cCI6MjA5MzY5OTA5M30.fHwmf6fiYXrXf6jXS8sUcPUMLeFPyxfq9jy1lGQ-2Yw';
    </script>

    <script>
      (function () {
        var dotsEl = document.getElementById('pin-dots');
        var padEl = document.getElementById('pin-pad');
        if (!dotsEl || !padEl) return;

        // If a previous session is still in localStorage, jump to that home.
        try {
          var raw = localStorage.getItem('cmt_user');
          if (raw) {
            var u = JSON.parse(raw);
            window.location.href =
              u && u.role === 'manager' ? './dashboard.html' : './worker.html';
            return;
          }
        } catch (e) { /* ignore parse errors */ }

        var pin = '';
        var busy = false;

        function renderDots() {
          var dots = dotsEl.children;
          for (var i = 0; i < dots.length; i++) {
            dots[i].classList.toggle('filled', i < pin.length);
          }
        }

        function shake() {
          dotsEl.classList.remove('shake');
          // Force reflow so the animation restarts even on rapid retries.
          void dotsEl.offsetWidth;
          dotsEl.classList.add('shake');
        }

        function showBanner(text, type) {
          var el = document.createElement('div');
          el.className = 'banner ' + (type || 'info');
          el.textContent = text;
          document.body.appendChild(el);
          setTimeout(function () { el.remove(); }, 4000);
        }

        // SHA-256 hex via Web Crypto. Available on http://localhost,
        // https://, and on file:// in modern browsers.
        function sha256Hex(text) {
          var buf = new TextEncoder().encode(text);
          return crypto.subtle.digest('SHA-256', buf).then(function (h) {
            var out = '';
            var arr = new Uint8Array(h);
            for (var i = 0; i < arr.length; i++) {
              var s = arr[i].toString(16);
              out += s.length === 1 ? '0' + s : s;
            }
            return out;
          });
        }

        // Lazy-load the Supabase client from a CDN ESM URL so the login
        // screen has no bundler/file-path dependencies. Cached after first call.
        var supabasePromise = null;
        function getSupabase() {
          if (!supabasePromise) {
            supabasePromise = import(
              'https://esm.sh/@supabase/supabase-js@2'
            ).then(function (m) {
              return m.createClient(
                window.__CMT_SUPABASE_URL,
                window.__CMT_SUPABASE_ANON_KEY,
                { auth: { persistSession: false } }
              );
            });
          }
          return supabasePromise;
        }

        function tryLogin() {
          if (busy) return;
          busy = true;
          renderDots();

          sha256Hex(pin)
            .then(function (hash) {
              return getSupabase().then(function (supabase) {
                return supabase
                  .from('users')
                  .select('id, name, role')
                  .eq('pin', hash)
                  .maybeSingle();
              });
            })
            .then(function (res) {
              if (res && res.error) throw res.error;
              var data = res && res.data;
              if (data) {
                localStorage.setItem(
                  'cmt_user',
                  JSON.stringify({ id: data.id, name: data.name, role: data.role })
                );
                window.location.href =
                  data.role === 'manager'
                    ? './dashboard.html'
                    : './worker.html';
                return;
              }
              shake();
              pin = '';
              renderDots();
              busy = false;
            })
            .catch(function (err) {
              console.error('[login] failed:', err);
              showBanner(
                'Login failed: ' + (err && err.message ? err.message : err),
                'error'
              );
              shake();
              pin = '';
              renderDots();
              busy = false;
            });
        }

        function press(value) {
          if (busy) return;
          if (value === 'back') {
            pin = pin.slice(0, -1);
          } else if (value === 'clear') {
            pin = '';
          } else if (/^[0-9]$/.test(value) && pin.length < 4) {
            pin += value;
          }
          renderDots();
          if (pin.length === 4) tryLogin();
        }

        padEl.addEventListener('click', function (e) {
          var btn = e.target.closest('button[data-key]');
          if (!btn) return;
          press(btn.getAttribute('data-key'));
        });

        // Allow physical keyboard for desktop testing.
        document.addEventListener('keydown', function (e) {
          if (/^[0-9]$/.test(e.key)) press(e.key);
          else if (e.key === 'Backspace') press('back');
          else if (e.key === 'Escape') press('clear');
        });

        renderDots();
      })();
    </script>
  </body>
</html>
